schema:
  schema_id: aegis_zhuyin
  name: 注音
  version: "1.0"
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]
  filters: [uniquifier]
menu:
  page_size: 10
translator:
  dictionary: terra_pinyin
  prism: aegis_zhuyin
  preedit_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
speller:
  alphabet: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347"
  initials: "1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/-"
  finals: " 6347"
  delimiter: "'"
  use_space: true
  algebra:
    __patch:
      - zhuyin:/pinyin_to_zhuyin
      - zhuyin:/fuzzy
      - zhuyin:/abbreviation
      - zhuyin:/keymap_bopomofo
