schema:
  schema_id: aegis_pinyin
  name: 拼音
  version: "1.0"
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]
  filters: [uniquifier]
menu:
  page_size: 10
translator:
  dictionary: pinyin_simp
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: "'"
  algebra:
    - derive/^zh/z/
    - derive/^z/zh/
    - derive/^ch/c/
    - derive/^c/ch/
    - derive/^sh/s/
    - derive/^s/sh/
    - derive/^n/l/
    - derive/^l/n/
    - derive/^f/h/
    - derive/^h/f/
    - derive/eng$/en/
    - derive/en$/eng/
    - derive/ang$/an/
    - derive/an$/ang/
    - derive/ing$/in/
    - derive/in$/ing/
